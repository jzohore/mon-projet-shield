grumphp:
    stop_on_failure: true
    process_timeout: 120
    git_hook_variables:
        EXEC_GRUMPHP_COMMAND: 'docker compose exec -T php'
    tasks:
        env_security:
            metadata:
                task: composer_script
            script: env:sanitize

        # 1. Sécurité : Exécute le script "security-audit" de ton composer.json
        audit_security:
            metadata:
                task: composer_script # 🪄 C'est ici ! On utilise le bon moteur d'exécution de scripts
            script: security-audit

        # 2. Linters Symfony : Exécute le script "lint" de ton composer.json (Twig + Yaml)
#        lint_symfony:
#            metadata:
#                task: composer_script # 🪄 Et ici aussi
#            script: lint

        # 3. Qualité : Formattage automatique (PSR-12 / PER)
        phpcsfixer:
            config: .php-cs-fixer.php
            triggered_by: [php]

        # 4. Analyse Statique : Niveau de typage strict (DDD)
        phpstan:
            level: 8
            memory_limit: "2G"
            triggered_by: [php]

        # 5. Architecture : Le gardien de ton DDD (Hexagonale)
        deptrac:
            depfile: deptrac.yaml

        # 6. Hygiène : Interdit les résidus de debug
        git_blacklist:
            keywords:
                - "var_dump("
                - "die("
                - "dd("
                - "dump("
                - "print_r("
            triggered_by: [php]
            match_word: true
            whitelist_patterns:
                - /^src\//

        # 7. Tests : On ne commit pas si les tests unitaires échouent
        phpunit:
            always_execute: true
