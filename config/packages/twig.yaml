twig:
    file_name_pattern: '*.twig'
    form_themes:
        - 'form/stripe_theme.html.twig'
    paths:
        '%kernel.project_dir%/templates/admin': admin
        '%kernel.project_dir%/templates/app': app
        '%kernel.project_dir%/templates/website': website
        '%kernel.project_dir%/templates/security': security
        '%kernel.project_dir%/templates/emails': emails
    globals:
        company_name: '%env(COMPANY_NAME)%'
        workspace_info: '@App\Infrastructure\Shared\Twig\AppExtension'
        s3_base_url: '%env(S3_BASE_URL)%'
        kysure_name: '%env(KYSURE_NAME)%'
        kysure_siret: '%env(KYSURE_SIRET)%'
        kysure_address: '%env(KYSURE_ADDRESS)%'
        kysure_contact_email: '%env(KYSURE_CONTACT_EMAIL)%'
        kysure_cgv_version: '%env(KYSURE_CURRENT_CGV_VERSION)%'
        # Analytique Umami : renseigner UMAMI_SCRIPT_URL et UMAMI_WEBSITE_ID dans
        # .env.local après avoir créé le site dans l'UI Umami. Vides = pas de script.
        umami_src: '%env(default::UMAMI_SCRIPT_URL)%'
        umami_website_id: '%env(default::UMAMI_WEBSITE_ID)%'
    date:
        timezone: Europe/Paris
when@test:
    twig:
        strict_variables: true
