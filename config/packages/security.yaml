security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # 1. DEUX POPULATIONS DISTINCTES
    providers:
        app_user_provider:
            entity:
                class: App\Domain\User\Entity\User
                property: email
        app_client_provider:
            entity:
                class: App\Domain\User\Entity\Client
                property: email
        app_admin_provider:
            entity:
                class: App\Domain\User\Entity\Admin
                property: email


    # LA PYRAMIDE DES RÔLES (Préservée)
    role_hierarchy:
        # --- L'arbre métier ---
        ROLE_CLIENT: [ ROLE_USER ]
        ROLE_WORKSPACE_COLLAB: [ ROLE_USER ]
        ROLE_WORKSPACE_ADMIN: [ ROLE_WORKSPACE_COLLAB ]

        # --- L'arbre système ---
        ROLE_ADMIN: [ ROLE_USER, ROLE_ALLOWED_TO_SWITCH ]
        ROLE_SUPER_ADMIN: [ ROLE_ADMIN ]

    firewalls:
        image_resolver:
            pattern: ^/media/cache/resolve
            security: false
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # 🟦 FIREWALL 1 : LE PORTAIL CLIENT FINAL (Magic Link Dédié)
        admin:
            pattern: ^/admin
            provider: app_admin_provider
            lazy: true
            custom_authenticator:
                - App\Infrastructure\Security\MagicAdminLinkAuthenticator
            form_login:
                login_path: app_login
                check_path: app_admin_verify
                enable_csrf: true
                default_target_path: admin_dashboard
                always_use_default_target_path: true
            logout:
                path: app_admin_logout
                target: app_login
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

        # 🟦 FIREWALL 1 : LE PORTAIL CLIENT FINAL (Magic Link Dédié)
        portal:
            pattern: ^/portal
            provider: app_client_provider
            lazy: true
            custom_authenticator:
                - App\Infrastructure\Security\MagicClientLinkAuthenticator
            form_login:
                login_path: app_login
                check_path: app_portal_verify
                enable_csrf: true
                default_target_path: app_portal_dashboard
                always_use_default_target_path: true
            logout:
                path: app_portal_logout
                target: app_login
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

            two_factor:
                auth_form_path: 2fa_login
                check_path: 2fa_login_check
                trusted_parameter_name: _trusted

        # 🟪 FIREWALL 2 : L'APPLICATION DES CGP & ADMINS (Ton firewall principal existant)
        main:
            pattern: ^/
            lazy: true
            provider: app_user_provider

            custom_authenticator:
                - App\Infrastructure\Security\MagicLinkAuthenticator

            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_dashboard

            logout:
                path: app_logout
                target: app_login

            login_throttling:
                max_attempts: 3
                interval: '15 minutes'

            two_factor:
                auth_form_path: 2fa_login
                check_path: 2fa_login_check
                trusted_parameter_name: _trusted

            switch_user: true
            user_checker: App\Infrastructure\Security\WorkspaceStatusChecker

    # 2. VERROUILLAGE CHIRURGICAL DES ROUTES
    access_control:
        # Routes publiques absolues
        - { path: ^/portal/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/stripe/webhook, roles: PUBLIC_ACCESS }
        # Accusé de réception du DER : lien nominatif à jeton (256 bits, haché en base), pas de compte client à ce stade.
        - { path: ^/der/, roles: PUBLIC_ACCESS }
        - { path: ^/api/track, roles: PUBLIC_ACCESS }
        - { path: ^/login, roles: PUBLIC_ACCESS }

        # Double authentification en cours
        - { path: ^/2fa, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }

        # Protection étanche du Portail Client
        - { path: ^/portal, roles: ROLE_CLIENT }

        # Protection de l'espace utilisateur et de l'application CGP
        - { path: ^/app/, roles: ROLE_USER }

        # Protection de l'espace administrateur'
        - { path: ^/admin, roles: ROLE_SUPER_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
