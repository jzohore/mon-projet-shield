framework:
    rate_limiter:
        # Anti-abus du lien public d'accusé de réception du DER (par IP).
        # Actions qui mutent l'état (accuser réception, refuser) : strict.
        der_acknowledgement:
            policy: 'sliding_window'
            limit: 10
            interval: '1 hour'
        # Simple consultation (page, PDF, attestation) : plus large, mais bornée
        # quand même — chaque hit sur /pdf ou /certificate coûte un GET S3 complet.
        der_acknowledgement_read:
            policy: 'sliding_window'
            limit: 60
            interval: '1 hour'
        # Ajout de clients au portefeuille (par utilisateur CGP). Borne
        # l'énumération d'e-mails : un usage normal reste très en dessous.
        client_creation:
            policy: 'sliding_window'
            limit: 30
            interval: '1 hour'
        # Création de compte pro depuis /register (par IP). Chaque acceptation
        # crée un User + envoie un e-mail : on borne fort pour couper le bombing
        # d'e-mails et la pollution de la base. Un usage légitime = 1 création.
        user_registration:
            policy: 'sliding_window'
            limit: 5
            interval: '15 minutes'
        # Envoi d'invitations collaborateur (par IP). Un cabinet invite quelques
        # personnes puis s'arrête ; on borne le bombing via révocation/réinvitation.
        workspace_invitation:
            policy: 'sliding_window'
            limit: 20
            interval: '1 hour'
        # Renvoi d'une invitation (clé = jeton de l'invitation). Chaque renvoi
        # régénère un jeton d'accès + envoie un e-mail à un tiers : strict.
        workspace_invitation_resend:
            policy: 'sliding_window'
            limit: 5
            interval: '1 hour'
        # Consommation du lien public confirm/{token} (par IP). Le brute force est
        # hors de portée (512 bits) : on borne le DoS et on rend l'abus détectable.
        workspace_invitation_confirm:
            policy: 'sliding_window'
            limit: 10
            interval: '1 hour'
