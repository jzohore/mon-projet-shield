name: 🚀 KYSURE CI/CD Pipeline

# 🛡️ LES BONS DÉCLENCHEURS (Triggers)
on:
    pull_request:
        branches: [ main, staging ] # La CI tourne quand on propose du code
    push:
        branches: [ staging ]       # La CD tourne quand on valide (merge) le code sur staging

permissions:
    contents: read

jobs:
    # ==========================================
    # 🛠️ CI : INTÉGRATION CONTINUE (Tourne sur les PRs)
    # ==========================================

    quality-assurance:
        name: Code Quality & Static Analysis (PHP 8.4)
        # Ne tourne que sur les PRs pour économiser des ressources, ou si on push direct sur staging
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4 # 🚀 FIX : v4 est la dernière version
              with:
                  fetch-depth: 0

            - name: Scan for leaked secrets (gitleaks)
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup PHP 8.4
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, apcu, opcache, zip, amqp, sockets, gd, imagick, sodium
                  coverage: none

            - name: Validate composer.json
              run: composer validate --strict

            - name: Get Composer Cache Directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Dependencies
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-php84-${{ hashFiles('**/composer.lock') }}
                  restore-keys: ${{ runner.os }}-composer-php84-

            - name: Install Dependencies
              run: composer install --prefer-dist --no-progress --no-interaction

            - name: Run KYSURE Quality Pipeline (GrumPHP)
              run: vendor/bin/grumphp run --no-interaction

    docker-security:
        name: 🐳 Docker Build & Security Scan
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4 # 🚀 FIX : v4

            - name: Lint Dockerfile (hadolint)
              uses: hadolint/hadolint-action@v3.1.0
              with:
                  dockerfile: Dockerfile
                  failure-threshold: error

            - name: Build Docker image (smoke test)
              run: |
                  docker build --target frankenphp_prod -t kysure-ci-scan:${{ github.sha }} .

            - name: Scan image for vulnerabilities (Trivy)
              uses: aquasecurity/trivy-action@master # 🚀 FIX : master ou 0.28.0 (la syntaxe a changé récemment)
              with:
                  image-ref: kysure-ci-scan:${{ github.sha }}
                  format: table
                  severity: CRITICAL
                  exit-code: 1
                  ignore-unfixed: true

    # ==========================================
    # 🚀 CD : DÉPLOIEMENT CONTINU (Tourne UNIQUEMENT sur un push/merge staging)
    # ==========================================

