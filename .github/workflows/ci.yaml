name: KYSURE Quality Gate (CI)

on:
  pull_request:
    branches: [ "main", "staging" ]
  push:
    branches: [ "main", "staging" ]

jobs:
  quality-assurance:
    name: Code Quality & Static Analysis (PHP 8.4)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, redis
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run KYSURE Quality Pipeline (GrumPHP)
        # 🛡️ Si ceci échoue, GitHub marque la PR en rouge et le Webhook vers Coolify ne sera pas déclenché (si tu merges pas)
        run: vendor/bin/grumphp run --no-interaction
